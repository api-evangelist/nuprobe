aid: nuprobe
name: NuProbe
description: >-
  NuProbe is a genomics and molecular diagnostics company founded in 2016 on technology licensed
  from the Wyss Institute at Harvard University and Rice University, with headquarters in Shanghai,
  China and a US subsidiary, NuProbe USA, in Houston, Texas. Its two core chemistries are Blocker
  Displacement Amplification (BDA), which enriches low-frequency DNA variants ahead of sequencing or
  PCR, and Quantitative Amplicon Sequencing (QASeq), a UMI-based multiplexed amplicon method for the
  simultaneous ultrasensitive detection of mutations and copy number variations from FFPE tissue,
  fresh or frozen tissue and cell-free DNA. The company sells research-use assay panels for oncology
  and reproductive health, custom assay development, and biopharma services, and has licensed or
  co-developed its chemistry with Bio-Rad, Oxford Nanopore, QIAGEN, Illumina and Bionano. NuProbe is
  an assay and reagent company: its bioinformatics and primer-design algorithms are delivered inside
  its products and services rather than as a public developer platform, and it publishes no API,
  SDK, developer portal or machine-readable specification of any kind.
